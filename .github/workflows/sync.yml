# Sync recent Spotify plays because Spotify only returns the latest 50.
# Needs MongoDB, Spotify, TOKEN_KEY and DeepL secrets.
name: Sync listening history

on:
  schedule:
    # Run every 15 minutes; GitHub may delay scheduled jobs.
    - cron: "7,22,37,52 * * * *"
  # Allow manual runs.
  workflow_dispatch:

# Prevent overlapping sync jobs.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: node jobs/sync.js
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      # Cache the emotion model between runs.
      - uses: actions/cache@v4
        with:
          path: server/.models
          key: emotion-model-${{ hashFiles('server/services/mood/emotion.js') }}
          restore-keys: emotion-model-
      # Analyze songs even when some syncs fail.
      - if: ${{ !cancelled() }}
        run: node jobs/analyse.js
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
